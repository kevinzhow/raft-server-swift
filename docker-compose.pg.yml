services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: raft
      POSTGRES_PASSWORD: raft
      POSTGRES_DB: raft
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raft -d raft"]
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - raft-pg-data:/var/lib/postgresql/data

volumes:
  raft-pg-data:
